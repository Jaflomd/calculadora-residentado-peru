<!DOCTYPE html>
<html lang="es" id="htmlroot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doctitle">Calculadora de Ingreso al Residentado Médico — Perú</title>
<style>
  :root { --rojo:#B03A2E; --teal:#0E7C7B; --tinta:#2C3338; --papel:#FAF8F5; --borde:#E6E0D8; --suave:#6E675D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--papel); color:var(--tinta); line-height:1.55; }
  .wrap { max-width:680px; margin:0 auto; padding:32px 20px 60px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1 { font-size:1.45rem; letter-spacing:-.02em; }
  h1 span { color:var(--rojo); }
  .lang { display:flex; gap:4px; flex-shrink:0; }
  .lang button { padding:4px 10px; border:1px solid var(--borde); background:#fff; border-radius:6px; cursor:pointer; font-size:.85rem; color:var(--suave); }
  .lang button[aria-pressed="true"] { border-color:var(--teal); color:var(--teal); font-weight:700; background:#F0FAFA; }
  .sub { color:var(--suave); font-size:.9rem; margin:6px 0 24px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:10px; padding:22px; margin-bottom:16px; }
  .modo { display:flex; gap:8px; margin-bottom:18px; }
  .modo button { flex:1; padding:10px; border:1px solid var(--borde); background:#fff; border-radius:8px; cursor:pointer; font-size:.9rem; color:var(--suave); }
  .modo button[aria-pressed="true"] { border-color:var(--teal); color:var(--teal); font-weight:600; background:#F0FAFA; }
  label { display:block; font-size:.82rem; font-weight:600; margin:14px 0 4px; }
  select,input[type=text] { width:100%; padding:9px 10px; border:1px solid var(--borde); border-radius:7px; font-size:16px; background:#fff; color:var(--tinta); }
  input.invalido { border-color:var(--rojo); background:#FBF1EF; }
  .fila { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media (max-width:480px){ .fila { grid-template-columns:1fr; } .modo { flex-direction:column; } }
  .res { text-align:center; padding:26px 20px; }
  .res .pct { font-size:3.2rem; font-weight:700; letter-spacing:-.03em; }
  .res .etq { font-size:.9rem; color:var(--suave); margin-top:2px; }
  .aviso-inline { font-size:.82rem; color:var(--rojo); margin-top:10px; font-weight:600; }
  .barra { height:10px; background:var(--borde); border-radius:5px; margin:16px auto 4px; max-width:420px; overflow:hidden; }
  .barra div { height:100%; width:0%; min-width:3px; background:var(--tinta); transition:width .4s, background .4s; }
  .chip { display:inline-block; font-size:.78rem; padding:2px 10px; border-radius:999px; border:1px solid var(--borde); color:var(--suave); margin-top:10px; }
  .nota { font-size:.82rem; color:var(--suave); }
  .nota b { color:var(--tinta); }
  select[size] { height:auto; }
  @media (min-width:900px) {
    .wrap { max-width:1100px; }
    .layout { display:grid; grid-template-columns:1.35fr 1fr; gap:18px; align-items:start; }
    .lado { position:sticky; top:20px; }
    h1 { font-size:1.7rem; }
  }
  details { margin-top:14px; font-size:.85rem; color:var(--suave); }
  summary { cursor:pointer; font-weight:600; color:var(--tinta); }
  footer { margin-top:26px; font-size:.78rem; color:var(--suave); text-align:center; }
  a { color:var(--teal); }
</style>
</head>

  <div class="main">

        <option value="pct" id="o_f_pct"></option>
        <option value="t" id="o_f_t"></option>

      <p class="nota" id="tconv" style="font-weight:600"></p>
      <p class="nota" id="t_nnota"></p>
    </div>

    <label for="espFiltro" id="t_lesp"></label>
    <input type="text" id="espFiltro" autocomplete="off">
    <select id="esp" aria-label="Especialidad"></select>
    <p class="nota" id="espInfo"></p>

    <div class="fila">
      <div>
        <label for="enam" id="t_lenam"></label>
        <select id="enam">
          <option value="no" id="o_enam_no"></option>
          <option value="1" id="o_enam_1"></option>
          <option value="1.5" selected id="o_enam_15"></option>
          <option value="2" id="o_enam_2"></option>
        </select>
      </div>
      <div>
        <label for="serum" id="t_lserum"></label>
        <select id="serum">
          <option value="0" id="o_ser_0"></option>
          <option value="1" id="o_ser_1"></option>
          <option value="2" selected id="o_ser_2"></option>
        </select>
      </div>
      <div>
        <label for="quinto" id="t_lquinto"></label>
        <select id="quinto"><option value="0" id="o_q_no"></option><option value="1" id="o_q_si"></option></select>
      </div>
      <div>
        <label for="mod" id="t_lmod"></label>
        <select id="mod">
          <option value="libre" id="o_m_libre"></option>
          <option value="cautiva" id="o_m_cautiva"></option>
        </select>
      </div>
      <div>
        <label for="anios" id="t_lanios"></label>
        <input type="text" inputmode="numeric" id="anios" value="2" autocomplete="off">
      </div>
      <div>
        <label for="intento" id="t_lintento"></label>
        <input type="text" inputmode="numeric" id="intento" value="1" autocomplete="off">
      </div>
      <div>
        <label for="sexo" id="t_lsexo"></label>
        <select id="sexo"><option value="0" id="o_s_f"></option><option value="1" id="o_s_m"></option></select>
      </div>
    </div>
  </div>

  </div>
  <div class="lado">
  <div class="card res" aria-live="polite">
    <div class="pct" id="pct">—</div>
    <div class="etq" id="etq"></div>
    <div class="barra" aria-hidden="true"><div id="barrafill"></div></div>
    <span class="chip" id="chipmodo"></span>
    <div class="aviso-inline" id="avisoinline" hidden></div>
  </div>
  </div>
  </div>

  <div class="card">
    <details open>
      <summary id="t_av_t"></summary>
      <p style="margin-top:8px" id="t_av_p"></p>
    </details>
    <details>
      <summary id="t_como_t"></summary>
      <p style="margin-top:8px" id="t_como_p"></p>
    </details>
  </div>

  <footer id="t_footer"></footer>
</div>

const sel = document.getElementById('esp');
const filtro = document.getElementById('espFiltro');
let espSel = DEFAULT_IDX;
function normaliza(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function rebuildEsp(q){
  const nq = normaliza(q || '');
  sel.innerHTML = '';
  let matches = 0, firstIdx = null;
  D.esp.forEach((e,i)=>{
    if (nq && !normaliza(e.n).includes(nq)) return;
    const o = document.createElement('option'); o.value = i; o.textContent = e.n; sel.appendChild(o);
    if (firstIdx === null) firstIdx = i;
    matches++;
  });
  if (!matches){
    const o = document.createElement('option'); o.value = espSel; o.textContent = D.esp[espSel].n;
    sel.appendChild(o); firstIdx = espSel; matches = 1;
  }
  const sigue = [...sel.options].some(o => +o.value === espSel);
  sel.value = sigue ? espSel : firstIdx;
  espSel = +sel.value;
  sel.size = nq ? Math.min(8, Math.max(2, matches)) : 1;
}
rebuildEsp('');
filtro.addEventListener('input', () => rebuildEsp(filtro.value));
sel.addEventListener('change', () => {
  espSel = +sel.value;
  if (sel.size > 1) { filtro.value = ''; rebuildEsp(''); }
});

function num(id){
  const el = document.getElementById(id);
  const raw = el.value.trim().replace(',', '.');
  if (raw === '' || isNaN(Number(raw))) return null;
  return Number(raw);
}
function marca(id, ok){ document.getElementById(id).classList.toggle('invalido', !ok); }

function setLang(l){
  lang = l; localStorage.setItem('calc_lang', l);
  document.getElementById('htmlroot').lang = l;
  document.getElementById('langes').setAttribute('aria-pressed', l==='es');
  document.getElementById('langen').setAttribute('aria-pressed', l==='en');
  const t = M[l];
  document.title = t.titulo.replace(/<[^>]+>/g,'');
  document.getElementById('t_titulo').innerHTML = t.titulo;
  document.getElementById('t_sub').innerHTML = t.sub;
  document.getElementById('btn2a').textContent = t.b2a;
  document.getElementById('btn2b').textContent = t.b2b;
  const map = {t_lfuente:'lfuente',t_lnotaval:'lnotaval',t_nnota:'nnota',
    o_f_aciertos:'o_f_aciertos',o_f_p80:'o_f_p80',o_f_pct:'o_f_pct',o_f_t:'o_f_t',
    t_lesp:'lesp',t_lenam:'lenam',t_lserum:'lserum',
    t_lquinto:'lquinto',t_lmod:'lmod',t_lanios:'lanios',t_lintento:'lintento',t_lsexo:'lsexo',
    o_enam_no:'o_enam_no',o_enam_1:'o_enam_1',o_enam_15:'o_enam_15',o_enam_2:'o_enam_2',
    o_ser_0:'o_ser_0',o_ser_1:'o_ser_1',o_ser_2:'o_ser_2',o_q_no:'o_q_no',o_q_si:'o_q_si',
    o_m_libre:'o_m_libre',o_m_cautiva:'o_m_cautiva',
    o_s_f:'o_s_f',o_s_m:'o_s_m',t_av_t:'av_t',t_como_t:'como_t',t_footer:'footer'};
  for (const id in map) document.getElementById(id).textContent = t[map[id]];
  document.getElementById('espFiltro').placeholder = t.espfiltro_ph;
  document.getElementById('t_av_p').innerHTML = t.av_p;
  document.getElementById('t_como_p').innerHTML = t.como_p;
  calc();
}
function setModo(m){
  modo = m;
  document.getElementById('btn2a').setAttribute('aria-pressed', m==='2a');
  document.getElementById('btn2b').setAttribute('aria-pressed', m==='2b');
  document.getElementById('campoNota').style.display = (m==='2a') ? 'block' : 'none';
  calc();
}
function calc(){
  const t = M[lang];
  const e = D.esp[+sel.value];
  document.getElementById('espInfo').textContent = t.comp(t.niveles[e.e], e.z.toFixed(2));
  const pct = document.getElementById('pct'), etq = document.getElementById('etq');
  const aviso = document.getElementById('avisoinline'), fill = document.getElementById('barrafill');

  // validación explícita: nada de defaults silenciosos
  const anios = num('anios'), intento = num('intento');
  const fuente = document.getElementById('fuente').value;
  const RNG = {aciertos:[0,200], p80:[0,80], pct:[1,99], t:[10,95]}[fuente];
  const val = num('notaVal');
  const tconv = document.getElementById('tconv');
  let nota = null, error = null;
  if (modo==='2a') {
    if (val===null || val<RNG[0] || val>RNG[1]) {
      error = t.invalida(t.rangos[fuente], RNG[0], RNG[1]); marca('notaVal', false); tconv.textContent='';
    } else {
      nota = toT(fuente, val);
      if (nota<10 || nota>95) { error = t.t_fuera; marca('notaVal', false); tconv.textContent=''; }
      else { marca('notaVal', true); tconv.textContent = (fuente==='t') ? '' : t.conv(nota.toFixed(1)); }
    }
  } else { marca('notaVal', true); tconv.textContent=''; }
  if (anios===null || anios<0 || anios>40) { error = error || t.invalida(t.campo_anios,0,40); marca('anios', false); } else marca('anios', true);
  if (intento===null || intento<1 || intento>10) { error = error || t.invalida(t.campo_intento,1,10); marca('intento', false); } else marca('intento', true);
  if (error){
    pct.textContent = '—'; pct.style.color = 'var(--tinta)';
    etq.textContent = ''; fill.style.width = '0%';
    aviso.hidden = false; aviso.textContent = error;
    document.getElementById('chipmodo').textContent = (modo==='2a') ? t.chip2a : t.chip2b;
    return;
  }
  const enamV = document.getElementById('enam').value;
  const x = {
    competitividad_z: e.z,
    enam_ord_fill: enamV==='no' ? 0 : parseFloat(enamV),
    enam_no_rindio: enamV==='no' ? 1 : 0,
    quinto_superior: +document.getElementById('quinto').value,
    serum_ord: +document.getElementById('serum').value,
    anios_desde_egreso_cal_cont: anios,
    n_intento: intento,
    cautiva: document.getElementById('mod').value==='cautiva' ? 1 : 0,
    destaque: 0,
    sexo_M: +document.getElementById('sexo').value
  };
  const C = (modo==='2a') ? D.c2a : D.c2b;
  if (modo==='2a') x.examen_T = nota;
  let z = C['(Intercept)'];
  for (const k in x) if (k in C) z += C[k]*x[k];
  const p = 100/(1+Math.exp(-z));
  // sin certeza determinística: clamp de display
  pct.textContent = p < 0.1 ? t.menor : (p > 99.9 ? t.mayor : p.toFixed(1)+'%');
  pct.style.color = p>=60 ? 'var(--teal)' : (p>=30 ? 'var(--tinta)' : 'var(--rojo)');
  etq.textContent = t.etq(e.n);
  fill.style.width = Math.max(1, Math.min(100, p)).toFixed(1)+'%';
  fill.style.background = p>=60 ? 'var(--teal)' : (p>=30 ? 'var(--tinta)' : 'var(--rojo)');
  document.getElementById('chipmodo').textContent = (modo==='2a') ? t.chip2a : t.chip2b;
  // aviso de extrapolación dentro de rangos permitidos
  const extremo = (modo==='2a' && (nota<=15 || nota>=90)) || intento>=6 || anios>=25;
  const mensajes = [];
  if (modo==='2b') mensajes.push(t.sesgo2b);
  if (extremo) mensajes.push(t.extrapo);
  aviso.hidden = mensajes.length === 0;
  aviso.textContent = mensajes.join(' ');
}
document.querySelectorAll('select,input').forEach(el=>el.addEventListener('input', calc));
document.getElementById('fuente').addEventListener('change', function(){
  document.getElementById('notaVal').value = {aciertos:'130', p80:'52', pct:'70', t:'55'}[this.value];
  calc();
});
setLang(lang);
</script>
