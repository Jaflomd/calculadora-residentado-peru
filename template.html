<!DOCTYPE html>
<html lang="es" id="htmlroot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doctitle">Calculadora de Ingreso al Residentado Médico — Perú</title>
<style>
  :root { --rojo:#B03A2E; --teal:#0E7C7B; --tinta:#2C3338; --papel:#FAF8F5; --borde:#E6E0D8; --suave:#6E675D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--papel); color:var(--tinta); line-height:1.55; }
  .wrap { max-width:680px; margin:0 auto; padding:32px 20px 60px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1 { font-size:1.45rem; letter-spacing:-.02em; }
  h1 span { color:var(--rojo); }
  .lang { display:flex; gap:4px; flex-shrink:0; }
  .lang button { padding:4px 10px; border:1px solid var(--borde); background:#fff; border-radius:6px; cursor:pointer; font-size:.85rem; color:var(--suave); }
  .lang button[aria-pressed="true"] { border-color:var(--teal); color:var(--teal); font-weight:700; background:#F0FAFA; }
  .sub { color:var(--suave); font-size:.9rem; margin:6px 0 24px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:10px; padding:22px; margin-bottom:16px; }
  .modo { display:flex; gap:8px; margin-bottom:18px; }
  .modo button { flex:1; padding:10px; border:1px solid var(--borde); background:#fff; border-radius:8px; cursor:pointer; font-size:.9rem; color:var(--suave); }
  .modo button[aria-pressed="true"] { border-color:var(--teal); color:var(--teal); font-weight:600; background:#F0FAFA; }
  label { display:block; font-size:.82rem; font-weight:600; margin:14px 0 4px; }
  select,input[type=text] { width:100%; padding:9px 10px; border:1px solid var(--borde); border-radius:7px; font-size:16px; background:#fff; color:var(--tinta); }
  input.invalido { border-color:var(--rojo); background:#FBF1EF; }
  .fila { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media (max-width:480px){ .fila { grid-template-columns:1fr; } .modo { flex-direction:column; } }
  .res { text-align:center; padding:26px 20px; }
  .res .pct { font-size:3.2rem; font-weight:700; letter-spacing:-.03em; }
  .res .etq { font-size:.9rem; color:var(--suave); margin-top:2px; }
  .aviso-inline { font-size:.82rem; color:var(--rojo); margin-top:10px; font-weight:600; }
  .barra { height:10px; background:var(--borde); border-radius:5px; margin:16px auto 4px; max-width:420px; overflow:hidden; }
  .barra div { height:100%; width:0%; min-width:3px; background:var(--tinta); transition:width .4s, background .4s; }
  .chip { display:inline-block; font-size:.78rem; padding:2px 10px; border-radius:999px; border:1px solid var(--borde); color:var(--suave); margin-top:10px; }
  .nota { font-size:.82rem; color:var(--suave); }
  .nota b { color:var(--tinta); }
  details { margin-top:14px; font-size:.85rem; color:var(--suave); }
  summary { cursor:pointer; font-weight:600; color:var(--tinta); }
  footer { margin-top:26px; font-size:.78rem; color:var(--suave); text-align:center; }
  a { color:var(--teal); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="t_titulo"></h1>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button id="langes" aria-pressed="true" onclick="setLang('es')">ES</button>
      <button id="langen" aria-pressed="false" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <p class="sub" id="t_sub"></p>

  <div class="card">
    <div class="modo" role="group" aria-label="Modo">
      <button id="btn2a" aria-pressed="true" onclick="setModo('2a')"></button>
      <button id="btn2b" aria-pressed="false" onclick="setModo('2b')"></button>
    </div>

    <div id="campoNota">
      <label for="notaT" id="t_lnota"></label>
      <input type="text" inputmode="decimal" id="notaT" value="55" autocomplete="off">
      <p class="nota" id="t_nnota"></p>
    </div>

    <label for="esp" id="t_lesp"></label>
    <select id="esp"></select>
    <p class="nota" id="espInfo"></p>

    <div class="fila">
      <div>
        <label for="enam" id="t_lenam"></label>
        <select id="enam">
          <option value="no" id="o_enam_no"></option>
          <option value="1" id="o_enam_1"></option>
          <option value="1.5" selected id="o_enam_15"></option>
          <option value="2" id="o_enam_2"></option>
        </select>
      </div>
      <div>
        <label for="serum" id="t_lserum"></label>
        <select id="serum">
          <option value="0" id="o_ser_0"></option>
          <option value="1" id="o_ser_1"></option>
          <option value="2" selected id="o_ser_2"></option>
        </select>
      </div>
      <div>
        <label for="quinto" id="t_lquinto"></label>
        <select id="quinto"><option value="0" id="o_q_no"></option><option value="1" id="o_q_si"></option></select>
      </div>
      <div>
        <label for="mod" id="t_lmod"></label>
        <select id="mod">
          <option value="libre" id="o_m_libre"></option>
          <option value="cautiva" id="o_m_cautiva"></option>
          <option value="destaque" id="o_m_destaque"></option>
        </select>
      </div>
      <div>
        <label for="anios" id="t_lanios"></label>
        <input type="text" inputmode="numeric" id="anios" value="2" autocomplete="off">
      </div>
      <div>
        <label for="intento" id="t_lintento"></label>
        <input type="text" inputmode="numeric" id="intento" value="1" autocomplete="off">
      </div>
      <div>
        <label for="sexo" id="t_lsexo"></label>
        <select id="sexo"><option value="0" id="o_s_f"></option><option value="1" id="o_s_m"></option></select>
      </div>
    </div>
  </div>

  <div class="card res" aria-live="polite">
    <div class="pct" id="pct">—</div>
    <div class="etq" id="etq"></div>
    <div class="barra" aria-hidden="true"><div id="barrafill"></div></div>
    <span class="chip" id="chipmodo"></span>
    <div class="aviso-inline" id="avisoinline" hidden></div>
  </div>

  <div class="card">
    <details open>
      <summary id="t_av_t"></summary>
      <p style="margin-top:8px" id="t_av_p"></p>
    </details>
    <details>
      <summary id="t_como_t"></summary>
      <p style="margin-top:8px" id="t_como_p"></p>
    </details>
  </div>

  <footer id="t_footer"></footer>
</div>

<script>
const D = __DATA__;
const DEFAULT_IDX = __DEFAULT_IDX__;
let modo = '2a';
let lang = (localStorage.getItem('calc_lang') || (navigator.language||'es').slice(0,2)) === 'en' ? 'en' : 'es';

const M = {
es: {
  titulo:'Calculadora de Ingreso al <span>Residentado Médico</span> — Perú',
  sub:'Probabilidad de ingreso estimada con datos de <b>64 477 postulantes (2016–2025)</b>, validada en cohortes futuras (2024–2025).',
  b2a:'Tengo una nota en escala T (ENARM o simulacro)', b2b:'Aún no rindo (solo mi perfil)',
  lnota:'Tu nota en escala T (media 50, DE 10)',
  nnota:'Entre 10 y 95. Si usas un simulacro, tu academia debe estandarizarlo a T contra la distribución nacional (supuesto no validado; ver aviso).',
  lesp:'Especialidad a la que postulas', lenam:'Bonificación ENAM', lserum:'Puntaje SERUMS',
  lquinto:'¿Quinto superior?', lmod:'Modalidad', lanios:'Años desde tu egreso (0–40)',
  lintento:'Número de intento (1–10)', lsexo:'Sexo',
  o_enam_no:'No rendí el ENAM', o_enam_1:'ENAM 11–12.9 (+1.0)', o_enam_15:'ENAM 13–14.9 (+1.5)', o_enam_2:'ENAM ≥15 (+2.0)',
  o_ser_0:'0–6 puntos', o_ser_1:'7–9 puntos', o_ser_2:'10 puntos',
  o_q_no:'No', o_q_si:'Sí', o_m_libre:'Libre', o_m_cautiva:'Cautiva', o_m_destaque:'Destaque',
  o_s_f:'Femenino', o_s_m:'Masculino',
  niveles:{muy_alta:'MUY ALTA', alta:'ALTA', media:'MEDIA', baja:'BAJA'},
  comp:(e,z)=>'Competitividad '+e+' (z = '+z+', concursos 2024–2025)',
  etq:(n)=>'Probabilidad estimada de ingresar a '+n,
  chip2a:'Modelo con nota · AUROC 0.824', chip2b:'Modelo pre-examen · AUROC 0.788',
  invalida:(campo,min,max)=>'Revisa "'+campo+'": ingresa un número entre '+min+' y '+max+'.',
  extrapo:'Tu perfil está fuera del rango típico de los datos: interpreta con cautela.',
  menor:'<0.1%', mayor:'>99.9%',
  av_t:'Aviso importante — lee esto antes de usar el resultado',
  av_p:'Esta es una <b>herramienta de investigación</b>, no un instrumento oficial de CONAREME. La probabilidad proviene de modelos de regresión logística entrenados con los concursos 2016–2023 y validados temporalmente en 2024–2025 (AUROC 0.824 con nota; 0.788 sin nota). El uso de un <b>simulacro</b> como sustituto de la nota real asume que tu academia lo estandariza correctamente contra la distribución nacional; ese supuesto <b>no está validado</b>. La competitividad de cada especialidad se actualiza con datos 2024–2025 y puede cambiar cada año. El resultado es una estimación poblacional: no garantiza ni niega tu ingreso.',
  como_t:'¿Cómo funciona?',
  como_p:'Aplicamos una fórmula logística transparente cuyos coeficientes están publicados en el manuscrito y en este repositorio. La calculadora resuelve la competitividad de tu especialidad automáticamente. Dos modos: con nota (post-examen o simulacro) y sin nota (solo tu perfil académico, para orientación temprana).',
  footer:'Datos: resultados públicos de CONAREME 2016–2025 · Código y coeficientes abiertos · Manuscrito en preparación (Flores-Cohaila et al.)',
  campo_nota:'nota T', campo_anios:'años desde egreso', campo_intento:'número de intento',
},
en: {
  titulo:'Peruvian <span>Medical Residency</span> Admission Calculator',
  sub:'Admission probability estimated from <b>64,477 applicants (2016–2025)</b>, temporally validated in future cohorts (2024–2025).',
  b2a:'I have a T-scale score (ENARM or practice exam)', b2b:'I have not taken the exam (profile only)',
  lnota:'Your T-scale score (mean 50, SD 10)',
  nnota:'Between 10 and 95. If you use a practice exam, it must be standardized to the national T distribution (untested assumption; see notice).',
  lesp:'Specialty you are applying to', lenam:'ENAM bonus', lserum:'SERUMS score',
  lquinto:'Top-quintile honors?', lmod:'Application modality', lanios:'Years since graduation (0–40)',
  lintento:'Attempt number (1–10)', lsexo:'Sex',
  o_enam_no:'Did not take the ENAM', o_enam_1:'ENAM 11–12.9 (+1.0)', o_enam_15:'ENAM 13–14.9 (+1.5)', o_enam_2:'ENAM ≥15 (+2.0)',
  o_ser_0:'0–6 points', o_ser_1:'7–9 points', o_ser_2:'10 points',
  o_q_no:'No', o_q_si:'Yes', o_m_libre:'Open (libre)', o_m_cautiva:'Sponsored (cautiva)', o_m_destaque:'Destaque',
  o_s_f:'Female', o_s_m:'Male',
  niveles:{muy_alta:'VERY HIGH', alta:'HIGH', media:'MEDIUM', baja:'LOW'},
  comp:(e,z)=>e+' competitiveness (z = '+z+', 2024–2025 processes)',
  etq:(n)=>'Estimated probability of admission to '+n,
  chip2a:'Score-based model · AUROC 0.824', chip2b:'Pre-exam model · AUROC 0.788',
  invalida:(campo,min,max)=>'Check "'+campo+'": enter a number between '+min+' and '+max+'.',
  extrapo:'Your profile is outside the typical data range: interpret with caution.',
  menor:'<0.1%', mayor:'>99.9%',
  av_t:'Important notice — read before using the result',
  av_p:'This is a <b>research tool</b>, not an official CONAREME instrument. Probabilities come from logistic regression models trained on the 2016–2023 processes and temporally validated on 2024–2025 (AUROC 0.824 with score; 0.788 without). Using a <b>practice exam</b> as a substitute for the real score assumes correct standardization against the national T distribution; that assumption is <b>not validated</b>. Specialty competitiveness reflects 2024–2025 and may change every year. The result is a population estimate: it neither guarantees nor rules out admission. Specialty names are shown in Spanish as published by CONAREME.',
  como_t:'How does it work?',
  como_p:'We apply a transparent logistic equation whose coefficients are published in the manuscript and in this repository. The calculator automatically resolves the competitiveness of your specialty. Two modes: with a score (post-exam or practice) and without one (academic profile only, for early orientation).',
  footer:'Data: public CONAREME results 2016–2025 · Open code and coefficients · Manuscript in preparation (Flores-Cohaila et al.)',
  campo_nota:'T score', campo_anios:'years since graduation', campo_intento:'attempt number',
},
};

const sel = document.getElementById('esp');
D.esp.forEach((e,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=e.n; sel.appendChild(o); });
sel.value = DEFAULT_IDX;

function num(id){
  const el = document.getElementById(id);
  const raw = el.value.trim().replace(',', '.');
  if (raw === '' || isNaN(Number(raw))) return null;
  return Number(raw);
}
function marca(id, ok){ document.getElementById(id).classList.toggle('invalido', !ok); }

function setLang(l){
  lang = l; localStorage.setItem('calc_lang', l);
  document.getElementById('htmlroot').lang = l;
  document.getElementById('langes').setAttribute('aria-pressed', l==='es');
  document.getElementById('langen').setAttribute('aria-pressed', l==='en');
  const t = M[l];
  document.title = t.titulo.replace(/<[^>]+>/g,'');
  document.getElementById('t_titulo').innerHTML = t.titulo;
  document.getElementById('t_sub').innerHTML = t.sub;
  document.getElementById('btn2a').textContent = t.b2a;
  document.getElementById('btn2b').textContent = t.b2b;
  const map = {t_lnota:'lnota',t_nnota:'nnota',t_lesp:'lesp',t_lenam:'lenam',t_lserum:'lserum',
    t_lquinto:'lquinto',t_lmod:'lmod',t_lanios:'lanios',t_lintento:'lintento',t_lsexo:'lsexo',
    o_enam_no:'o_enam_no',o_enam_1:'o_enam_1',o_enam_15:'o_enam_15',o_enam_2:'o_enam_2',
    o_ser_0:'o_ser_0',o_ser_1:'o_ser_1',o_ser_2:'o_ser_2',o_q_no:'o_q_no',o_q_si:'o_q_si',
    o_m_libre:'o_m_libre',o_m_cautiva:'o_m_cautiva',o_m_destaque:'o_m_destaque',
    o_s_f:'o_s_f',o_s_m:'o_s_m',t_av_t:'av_t',t_como_t:'como_t',t_footer:'footer'};
  for (const id in map) document.getElementById(id).textContent = t[map[id]];
  document.getElementById('t_av_p').innerHTML = t.av_p;
  document.getElementById('t_como_p').innerHTML = t.como_p;
  calc();
}
function setModo(m){
  modo = m;
  document.getElementById('btn2a').setAttribute('aria-pressed', m==='2a');
  document.getElementById('btn2b').setAttribute('aria-pressed', m==='2b');
  document.getElementById('campoNota').style.display = (m==='2a') ? 'block' : 'none';
  calc();
}
function calc(){
  const t = M[lang];
  const e = D.esp[+sel.value];
  document.getElementById('espInfo').textContent = t.comp(t.niveles[e.e], e.z.toFixed(2));
  const pct = document.getElementById('pct'), etq = document.getElementById('etq');
  const aviso = document.getElementById('avisoinline'), fill = document.getElementById('barrafill');

  // validación explícita: nada de defaults silenciosos
  const nota = num('notaT'), anios = num('anios'), intento = num('intento');
  let error = null;
  if (modo==='2a' && (nota===null || nota<10 || nota>95)) { error = t.invalida(t.campo_nota,10,95); marca('notaT', false); } else marca('notaT', true);
  if (anios===null || anios<0 || anios>40) { error = error || t.invalida(t.campo_anios,0,40); marca('anios', false); } else marca('anios', true);
  if (intento===null || intento<1 || intento>10) { error = error || t.invalida(t.campo_intento,1,10); marca('intento', false); } else marca('intento', true);
  if (error){
    pct.textContent = '—'; pct.style.color = 'var(--tinta)';
    etq.textContent = ''; fill.style.width = '0%';
    aviso.hidden = false; aviso.textContent = error;
    document.getElementById('chipmodo').textContent = (modo==='2a') ? t.chip2a : t.chip2b;
    return;
  }
  const enamV = document.getElementById('enam').value;
  const x = {
    competitividad_z: e.z,
    enam_ord_fill: enamV==='no' ? 0 : parseFloat(enamV),
    enam_no_rindio: enamV==='no' ? 1 : 0,
    quinto_superior: +document.getElementById('quinto').value,
    serum_ord: +document.getElementById('serum').value,
    anios_desde_egreso_cal_cont: anios,
    n_intento: intento,
    cautiva: document.getElementById('mod').value==='cautiva' ? 1 : 0,
    destaque: document.getElementById('mod').value==='destaque' ? 1 : 0,
    sexo_M: +document.getElementById('sexo').value
  };
  const C = (modo==='2a') ? D.c2a : D.c2b;
  if (modo==='2a') x.examen_T = nota;
  let z = C['(Intercept)'];
  for (const k in x) if (k in C) z += C[k]*x[k];
  const p = 100/(1+Math.exp(-z));
  // sin certeza determinística: clamp de display
  pct.textContent = p < 0.1 ? t.menor : (p > 99.9 ? t.mayor : p.toFixed(1)+'%');
  pct.style.color = p>=60 ? 'var(--teal)' : (p>=30 ? 'var(--tinta)' : 'var(--rojo)');
  etq.textContent = t.etq(e.n);
  fill.style.width = Math.max(1, Math.min(100, p)).toFixed(1)+'%';
  fill.style.background = p>=60 ? 'var(--teal)' : (p>=30 ? 'var(--tinta)' : 'var(--rojo)');
  document.getElementById('chipmodo').textContent = (modo==='2a') ? t.chip2a : t.chip2b;
  // aviso de extrapolación dentro de rangos permitidos
  const extremo = (modo==='2a' && (nota<=15 || nota>=90)) || intento>=6 || anios>=25;
  aviso.hidden = !extremo;
  if (extremo) aviso.textContent = t.extrapo;
}
document.querySelectorAll('select,input').forEach(el=>el.addEventListener('input', calc));
setLang(lang);
</script>
</body>
</html>
